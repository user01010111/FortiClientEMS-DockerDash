# EMS 8.0.1.0192 / PostgreSQL 18. Merge with the matching vendor local-DB Compose file.
# The exporter digest is the tested upstream 0.19.1 image. No metrics ports are published.
# Keep instance-specific volume names in a separate local override, not this public file.
services:
  grafana:
    environment:
      EMS_DB_HOST: db
      EMS_DB_PORT: '5432'
      EMS_DB_USER: postgres
      EMS_DB_PASSWORD: ${POSTGRES_PASSWORD}
      GF_SERVER_SERVE_FROM_SUB_PATH: 'true'
      GF_SERVER_ROOT_URL: https://${FQDN}/grafana/
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD}
      GF_METRICS_ENABLED: 'true'
    volumes:
    - ./FortiClientEMS-DockerDash/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    - ./FortiClientEMS-DockerDash/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    - ./FortiClientEMS-DockerDash/grafana/dashboards:/var/lib/grafana/dashboards:ro
  nginx:
    volumes:
    - ./FortiClientEMS-DockerDash/nginx/nginx.conf:/etc/nginx/nginx.conf.template:ro
    - ./FortiClientEMS-DockerDash/nginx/ems-443.conf.template:/etc/nginx/sites-available/ems-443.conf.template:ro
  prometheus:
    image: prom/prometheus
    restart: always
    networks:
    - forticlientems
    volumes:
    - ./FortiClientEMS-DockerDash/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - prometheus-data:/prometheus
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
  node-exporter:
    image: prom/node-exporter
    restart: always
    networks:
    - forticlientems
    command:
    - --path.rootfs=/host
    - --path.procfs=/host/proc
    - --path.sysfs=/host/sys
    - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)
    volumes:
    - /:/host:ro,rslave
  cadvisor:
    image: gcr.io/cadvisor/cadvisor
    restart: always
    privileged: true
    networks:
    - forticlientems
    volumes:
    - /:/rootfs:ro
    - /var/run:/var/run:ro
    - /sys:/sys:ro
    - /var/lib/docker:/var/lib/docker:ro
    - /dev/disk:/dev/disk:ro
  nginx-prometheus-exporter:
    image: nginx/nginx-prometheus-exporter
    restart: always
    networks:
    - forticlientems
    command:
    - --nginx.scrape-uri=http://nginx:18080/stub_status
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter@sha256:e96064f876226d94bb6ce48a4c4b3dd76edba91168ec1ab024e5c4b959310b0f
    restart: always
    networks:
    - forticlientems
    environment:
      DATA_SOURCE_URI: db:5432/fcm_default?sslmode=disable&options=-csearch_path%3Dpublic%2Caddons
      DATA_SOURCE_USER: postgres
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD}
    volumes:
    - ./FortiClientEMS-DockerDash/postgres:/etc/postgres-exporter:ro
    entrypoint:
    - /bin/sh
    - /etc/postgres-exporter/entrypoint.sh
    command:
    - --extend.query-path=/tmp/queries.yml
    - --collector.stat_checkpointer
    - --collector.database_wraparound
    - --collector.long_running_transactions
    - --collector.stat_activity_autovacuum
    - --collector.stat_statements
    - --collector.postmaster
  redis-exporter:
    image: oliver006/redis_exporter:alpine
    restart: always
    networks:
    - forticlientems
    volumes:
    - db_shared_data:/db:ro
    entrypoint:
    - /bin/sh
    - -lc
    - . /db/.env && exec /redis_exporter --redis.addr=redis://redis:6379 --redis.password="$${EMS_REDIS_PASSWORD}"
  pgbouncer-exporter:
    image: spreaker/prometheus-pgbouncer-exporter:latest
    restart: always
    networks:
    - forticlientems
    environment:
      PGBOUNCER_HOST: pgbouncer
      PGBOUNCER_PORT: '6432'
      PGBOUNCER_USER: postgres
      PGBOUNCER_PASS: ${POSTGRES_PASSWORD}
      PGBOUNCER_EXPORTER_HOST: 0.0.0.0
  consul-exporter:
    image: prom/consul-exporter
    restart: always
    networks:
    - forticlientems
    command:
    - --consul.server=http://consul:8500
  blackbox-exporter:
    image: prom/blackbox-exporter
    restart: always
    networks:
    - forticlientems
    volumes:
    - ./FortiClientEMS-DockerDash/prometheus/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
    - --config.file=/etc/blackbox_exporter/config.yml
  redis:
    entrypoint:
    - /bin/sh
    - /usr/local/bin/ems-wait-auth.sh
    volumes:
    - ./FortiClientEMS-DockerDash/redis/wait-auth.sh:/usr/local/bin/ems-wait-auth.sh:ro
  db:
    command:
    - -c
    - max_connections=1092
    - -c
    - shared_preload_libraries=pg_stat_statements
    - -c
    - track_io_timing=on
    - -c
    - track_wal_io_timing=on
    - -c
    - track_cost_delay_timing=on
  postgres-fcm-exporter:
    image: prometheuscommunity/postgres-exporter@sha256:e96064f876226d94bb6ce48a4c4b3dd76edba91168ec1ab024e5c4b959310b0f
    restart: always
    networks:
    - forticlientems
    environment:
      DATA_SOURCE_URI: db:5432/fcm?sslmode=disable&options=-csearch_path%3Dpublic%2Caddons
      DATA_SOURCE_USER: postgres
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD}
    volumes:
    - ./FortiClientEMS-DockerDash/postgres/queries-database.yml:/etc/postgres-exporter/queries.yml:ro
    command:
    - --extend.query-path=/etc/postgres-exporter/queries.yml
    - --disable-default-metrics
    - --no-collector.database
    - --no-collector.locks
    - --no-collector.replication
    - --no-collector.replication_slot
    - --no-collector.roles
    - --no-collector.stat_bgwriter
    - --no-collector.stat_database
    - --no-collector.stat_progress_vacuum
    - --no-collector.wal
volumes:
  prometheus-data: null
