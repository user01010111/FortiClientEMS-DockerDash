# nginx.conf for FortiClient EMS
#
# SOURCE: Extracted from the EMS nginx container via:
#   docker cp "$(docker compose ps -q nginx)":/etc/nginx/nginx.conf nginx/nginx.conf
#
# MODIFICATIONS: Grafana reverse proxy locations added to the 443 server block.
#   Search for "── Grafana" to find the additions.
#
# MAINTENANCE: Re-extract and re-patch this file on each EMS version upgrade.
#   The SSL certificate paths and proxy upstreams are baked into the EMS image
#   and are populated at runtime via Docker volume mounts.

user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
        worker_connections 768;
}

http {

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    client_max_body_size 100M;
    server_names_hash_bucket_size 64;
    # server_name_in_redirect off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    map $ssl_client_verify $ztna_worker_header {
        default                          "";
        "SUCCESS"                        "";
        ""                               "1";
    }

    map $ssl_client_s_dn $client_cert_cn {
        "~CN=([^,]+)" $1;
    }

    map $request_uri $is_installer_download {
        default 0;
        ~*^/installers/[^/]+/[^/]+/\D+\d+\.\d+\.\d+[^.]*\.[a-z][a-z][a-z]$ 1;
    }

    log_format installer_json escape=json
    '{ "time":"$time_local",'
    ' "msecTime":"$msec",'
    ' "request":"$request",'
    ' "userAgent":"$http_user_agent",'
    ' "downloadSize":"$body_bytes_sent",'
    ' "timeToServeRequest":"$request_time",'
    ' "requestStatus":"$status",'
    ' "fctUID":"$http_forticlient_uid" }';

    # Redirect server for HTTP traffic
    server {
        listen 80;
        server_name localhost;

        location ^~ /.well-known/acme-challenge/ {
                alias /var/www/html/.well-known/acme-challenge/;
                default_type "text/plain";
        }

        location /.well-known/ {
            root /webserver;
            try_files $uri $uri/ =404;
        }

        location / {
            return 302 https://$host$request_uri; # Redirect all other traffic to HTTPS
        }
    }

    # Internal-only metrics listener for Prometheus.
    server {
        listen 18080;
        server_name localhost;

        access_log off;

        location = /stub_status {
            stub_status;
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            deny all;
        }
    }

    server {
        listen 443 ssl;
        listen 9443 ssl proxy_protocol;
        server_name _;

        ssl_certificate /opt/forticlientems/data/certs/ems.example.com.crt;
        ssl_certificate_key /opt/forticlientems/data/certs/ems.example.com.key;
        ssl_client_certificate /opt/forticlientems/data/certs/fortinet_ca_root_all.crt;
        ssl_trusted_certificate /opt/forticlientems/data/certs/fortinet_ca_root_all.crt;
        ssl_verify_client optional;
        ssl_verify_depth 10;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-AES128-GCM-SHA256:!aNULL:!MD5:!DSS:!RC4:!RSA";
        ssl_session_tickets off;
        client_max_body_size 0;

        set_real_ip_from 0.0.0.0/0;    # Trust all, but be cautious
        real_ip_header proxy_protocol;

        add_header Content-Security-Policy "default-src 'self'; img-src 'self' https: data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self' ws: wss:; style-src 'self' 'unsafe-inline' https://filestore.fortinet.com/fortiguard/icdb_logos96/sprite_map_front.css; frame-src 'self' https://www.fortiguard.com/; frame-ancestors 'self' https://*.forticloud.com;";
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Strict-Transport-Security "max-age=10886400";

        location / {
            include includes/common_proxy_headers.conf;
            proxy_pass http://webserver:8000;
            proxy_set_header Origin https://webserver;

            # Rewrite Set-Cookie Domain to the client's original request domain
            proxy_cookie_domain webserver $host;
        }

        # Comment out everything between *** ztnaworker *** to fall back to processing FOS API in webserver

	    # ************************** ztnaworker ***************************************
        location /api/v1/report/fct/tags {
            include includes/ztna_proxy_headers.conf;

            if ($ssl_client_verify = SUCCESS) {
                rewrite ^/api/v1/report/fct/tags(.*)$ /tags$1 break;
                proxy_pass http://ztna:8080;
            }


            if ($ssl_client_verify != SUCCESS) {
                proxy_pass http://webserver:8000;
            }
        }

        location /api/v1/report/fct/sysinfo {
            include includes/ztna_proxy_headers.conf;

            if ($ssl_client_verify = SUCCESS) {
                rewrite ^/api/v1/report/fct/sysinfo(.*)$ /sysinfo$1 break;
                proxy_pass http://ztna:8080;
            }

            if ($ssl_client_verify != SUCCESS) {
                proxy_pass http://webserver:8000;
            }
        }

        location /api/v1/fgt/gateway_details/vpn {
            include includes/ztna_proxy_headers.conf;

            if ($ssl_client_verify = SUCCESS) {
                rewrite ^/api/v1/fgt/gateway_details/vpn(.*)$ /vpn/app$1 break;
                proxy_pass http://ztna:8080;
            }

            if ($ssl_client_verify != SUCCESS) {
                proxy_pass http://webserver:8000;
            }
        }

        location /api/v1/fgt/gateway_details/gateway_mac {
            include includes/ztna_proxy_headers.conf;

            if ($ssl_client_verify = SUCCESS) {
                rewrite ^/api/v1/fgt/gateway_details/gateway_mac(.*)$ /gateway_mac$1 break;
                proxy_pass http://ztna:8080;
            }

            if ($ssl_client_verify != SUCCESS) {
                proxy_pass http://webserver:8000;
            }
        }

        location /api/v1/malware/hash {
            include includes/ztna_proxy_headers.conf;

            if ($ssl_client_verify = SUCCESS) {
                rewrite ^/api/v1/malware/hash(.*)$ /malware/hash$1 break;
                proxy_pass http://ztna:8080;
            }

            if ($ssl_client_verify != SUCCESS) {
                proxy_pass http://webserver:8000;
            }
        }

        location /api/v1/report/fct/uid_tags {
            include includes/ztna_proxy_headers.conf;

            if ($ssl_client_verify = SUCCESS) {
                rewrite ^/api/v1/report/fct/uid_tags(.*)$ /uid_tags$1 break;
                proxy_pass http://ztna:8080;
            }

            if ($ssl_client_verify != SUCCESS) {
                proxy_pass http://webserver:8000;
            }
        }

        location /api/v1/fabric/tag_list {
            include includes/ztna_proxy_headers.conf;

            if ($ssl_client_verify = SUCCESS) {
                rewrite ^/api/v1/fabric/tag_list(.*)$ /tag_list$1 break;
                proxy_pass http://ztna:8080;
            }

            if ($ssl_client_verify != SUCCESS) {
                proxy_pass http://webserver:8000;
            }
        }

        location /api/v1/report/fct/vuln {
            include includes/ztna_proxy_headers.conf;

            if ($ssl_client_verify = SUCCESS) {
                rewrite ^/api/v1/report/fct/vuln(.*)$ /vuln$1 break;
                proxy_pass http://ztna:8080;
            }

            if ($ssl_client_verify != SUCCESS) {
                proxy_pass http://webserver:8000;
            }
        }

        location /api/v1/report/fct/subscribe {
            include includes/ztna_proxy_headers.conf;

            if ($ssl_client_verify = SUCCESS) {
                rewrite ^/api/v1/report/fct/subscribe(.*)$ /subscribe$1 break;
                proxy_pass http://ztna:8080;
            }

            if ($ssl_client_verify != SUCCESS) {
                proxy_pass http://webserver:8000;
            }
        }

        location /api/v1/report/fct/security_posture {
            include includes/ztna_proxy_headers.conf;

            if ($ssl_client_verify = SUCCESS) {
                rewrite ^/api/v1/report/fct/security_posture(.*)$ /security_posture$1 break;
                proxy_pass http://ztna:8080;
            }

            if ($ssl_client_verify != SUCCESS) {
                proxy_pass http://webserver:8000;
            }
        }

        # base CRL and ZTNA cert are available for anyone, while delta CRL - for authorized clients only (FOS)
        location /api/v1/ztna_certificates/crl/download/delta {
            include includes/ztna_proxy_headers.conf;

            rewrite ^/api/v1/ztna_certificates/crl/download/delta$ /crl/download/delta break;
            proxy_pass http://ztna:8080;
        }

        location /api/v1/ztna_certificates/crl/download/base {
            include includes/ztna_proxy_headers.conf;

            # base CRL should be available without auth
            proxy_set_header X-Bypass-SN-Check 1;

            rewrite ^/api/v1/ztna_certificates/crl/download/base$ /crl/download/base break;
            proxy_pass http://ztna:8080;
        }

        location /api/v1/ztna_certificates/download {
            include includes/ztna_proxy_headers.conf;

            # EMS root CA cert should be available without auth
            proxy_set_header X-Bypass-SN-Check 1;

            rewrite ^/api/v1/ztna_certificates/download$ /ca/download break;
            proxy_pass http://ztna:8080;
        }

        # ************************** ztnaworker ***************************************

        # Static file handling
        location ~* ^/static/(css|dist|img|js) {
            root /webserver;
            try_files $uri $uri/ =404;
        }

        # ── Grafana reverse proxy ─────────────────────────────────────────────
        # Grafana is served at /grafana/ on this HTTPS listener.
        # The container is configured with:
        #   GF_SERVER_SERVE_FROM_SUB_PATH=true
        #   GF_SERVER_ROOT_URL=https://<fqdn>/grafana/
        # so all Grafana-generated URLs already carry the /grafana/ prefix.
        #
        # NOTE: The Content-Security-Policy header above has been updated to
        # include "ws: wss:" in connect-src so Grafana Live WebSockets work.

        location /grafana/ {
            proxy_pass         http://grafana:3000/grafana/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Port  $server_port;
            proxy_set_header   X-Forwarded-Host  $host;
            proxy_read_timeout    600;
            proxy_connect_timeout 600;
        }

        # WebSocket endpoint required by Grafana Live (real-time panel updates).
        location /grafana/api/live/ {
            proxy_pass         http://grafana:3000/grafana/api/live/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600;
        }
        # ── End Grafana ───────────────────────────────────────────────────────

        # Logging
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;
    }

    server {
        listen 10443 ssl;
        server_name localhost; # Replace localhost and 10443 with actual values

        #log used for deployment downloads
        access_log /opt/forticlientems/data/installer_download.log installer_json if=$is_installer_download;

        ssl_certificate /opt/forticlientems/data/certs/ems.example.com.crt;
        ssl_certificate_key /opt/forticlientems/data/certs/ems.example.com.key;
        ssl_protocols TLSv1.2 TLSv1.3; # Excludes SSLv2, SSLv3, TLSv1, TLSv1.1
        ssl_ciphers "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-AES128-GCM-SHA256:!aNULL:!MD5:!DSS:!RC4:!RSA";
        ssl_prefer_server_ciphers on;
        ssl_session_tickets off;

        # Proxy for /fct_saml with header manipulation
        location /fct_saml {
            proxy_pass http://webserver:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/invitation/register {
            proxy_pass https://localhost:443/api/v1/invitation/register;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 10443;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy for /saml with header manipulation
        location /saml {
            proxy_pass https://localhost:443/saml;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 10443;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Security Headers
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' https: data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self'; style-src 'self' 'unsafe-inline' https://filestore.fortinet.com/fortiguard/icdb_logos96/sprite_map_front.css; frame-src 'self' https://www.fortiguard.com/; frame-ancestors 'self' https://*.forticloud.com;";
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Strict-Transport-Security "max-age=10886400";

        # Aliases and directory handling
        root /opt/forticlientems/data/clients;
        location /installers/ {
            alias /opt/forticlientems/data/clients/installers/;
            autoindex on;
            try_files $uri $uri/ =404;
        }
        location /uninstaller/ {
            alias /opt/forticlientems/data/clientUninstaller/;
            autoindex on;
            try_files $uri $uri/ =404;
        }
        location /emsaval/ {
            alias /opt/forticlientems/data/signatures/emsaval/;
            autoindex on;
            try_files $uri $uri/ =404;
        }
        location /wfcustompages/ {
            alias /opt/forticlientems/wfcustompages/;
            autoindex on;
            try_files $uri $uri/ =404;
        }
        location /fct/ {
            alias /opt/forticlientems/data/fct/;
            autoindex on;
            try_files $uri $uri/ =404;
        }

        location = /fdccampaignpackages {
            return 301 /fdccampaignpackages/;
        }
        location = /fdccampaignpackages/ {
            return 404;
        }
        location /fdccampaignpackages/ {
            alias /opt/forticlientems/data/fdccampaignpackages/;
            autoindex off;
            try_files $uri $uri/ =404;
        }

        # MIME Types for specific file extensions
        types {
            application/octet-stream msi;
            application/octet-stream mst;
        }

    }

}
