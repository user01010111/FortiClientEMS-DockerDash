user $NGINX_USER;
worker_processes auto;
worker_rlimit_nofile 50000;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections $NGINX_WORKER_CONNECTIONS;
}

http {

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    client_max_body_size 100M;
    server_names_hash_bucket_size 64;

    proxy_buffer_size 32k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;
    # server_name_in_redirect off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off; # 1281280

    map $ssl_client_verify $ztna_worker_header {
        default                          "";
        "SUCCESS"                        "";
        ""                               "1";
    }

    map $ssl_client_s_dn $client_cert_cn {
        "~CN=([^,]+)" $1;
    }

    map $request_uri $is_installer_download {
        default 0;
        "~*^/[a-z0-9_-]+/installers/[^/]+/[^/]+/(?:(?:msi/(?:x64|x86|arm64)|hotfixes)/)?[^/]+\.[a-z]{3}$" 1;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    log_format installer_json escape=json
    '{ "time":"$time_local",'
    ' "msecTime":"$msec",'
    ' "request":"$request",'
    ' "userAgent":"$http_user_agent",'
    ' "downloadSize":"$body_bytes_sent",'
    ' "timeToServeRequest":"$request_time",'
    ' "requestStatus":"$status",'
    ' "If-None-Match":"$http_if_none_match",'
    ' "ETag":"$upstream_http_etag",'
    ' "Range":"$http_range",'
    ' "fctUID":"$http_forticlient_uid" }';

    upstream fcems_webserver {
        server $EMS_WEB_HOST:8000;
    }

    upstream fcems_ztna {
        server $EMS_ZTNA_HOST:$EMS_ZTNA_PORT;
    }

    upstream fcems_sslserver {
        server $SERVERNAME:$SERVERSSLPORT;
    }

    upstream fcems_fileserver {
        server $EMS_FILE_HOST:$EMS_FILE_PORT;
    }

    upstream fcems_aigateway {
        server $EMS_AI_GATEWAY_HOST:$EMS_AI_GATEWAY_PORT;
    }

    # Internal-only Prometheus status listener; no host-published port.
    server {
        listen 18080;
        server_name localhost;
        access_log off;
        location = /stub_status {
            stub_status;
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            deny all;
        }
    }

    include /etc/nginx/sites-enabled/*.conf;

}
